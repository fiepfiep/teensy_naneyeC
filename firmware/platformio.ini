; NanEyeC -> Teensy 4.1 -> USB camera firmware. See ../spec.md.
;
;   pio run                 build
;   pio run -t upload       build and flash (press the Teensy button if it does not reboot)
;   pio device monitor      open the USB serial port

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; USB_SERIAL is the default and is what the host protocol expects (spec.md section 7).
build_flags =
    -O2
    -Wall
    -Wextra
    -Wno-unused-parameter
    -D USB_SERIAL

; The board runs at its stock 600 MHz; the LPSPI root clock is set in firmware from
; PLL2_PFD2 rather than by the core (see seim::begin).
board_build.f_cpu = 600000000

upload_protocol = teensy-cli
monitor_speed = 115200
